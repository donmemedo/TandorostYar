services:
  backend:
    build:
      context: ./backend
    volumes:
      - pact-data:/data
    ports:
      - "8330:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: "http://backend:8000"
    ports:
      - "3330:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pact-data: