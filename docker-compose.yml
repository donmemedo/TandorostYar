# FitPeyman. Local trial:   DEMO=1 docker compose up -d --build   ->  http://localhost:3330
# Production: copy .env.example to .env, leave DEMO unset, set ADMIN_TOKEN and SMS_WEBHOOK_URL, set SITE_ADDRESS to your domain.
name: fitpeyman

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  logging: { driver: local, options: { max-size: "50m", max-file: "20" } } # ~1 GB of compressed history per service; ship it off-host too (docs/OPERATIONS.md)

services:
  backend:
    <<: *hardened
    build: ./backend
    image: fitpeyman-backend:local
    environment:
      DB_PATH: /data/pact.db
      DEMO: ${DEMO:-0}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_HOURLY_BUDGET: ${SMS_HOURLY_BUDGET:-300}
      LOG_KEY: ${LOG_KEY:-} # keys the phone references in logs (32+ chars); without it they only correlate within one process lifetime
      TRUSTED_PROXY_HOPS: "1" # exactly one proxy (edge) sits in front
      APP_TZ: Asia/Tehran
    volumes: [pact-data:/data]
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    mem_limit: 384m
    cpus: 1.0
    expose: ["8000"] # reachable by the edge only; never published to the host
    networks: [back] # the frontend (largest attack surface) cannot even resolve this service

  frontend:
    <<: *hardened
    build:
      context: ./frontend
      args: { BACKEND_URL: "http://backend:8000" }
    image: fitpeyman-frontend:local
    tmpfs: ["/tmp:size=16m,noexec,nosuid", "/app/.next/cache:size=64m,noexec,nosuid"]
    mem_limit: 384m
    cpus: 1.0
    expose: ["3000"]
    networks: [front]

  edge:
    <<: *hardened
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    cap_add: [NET_BIND_SERVICE]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:${PUBLIC_PORT:-3330}:80"
      # - "443:443" # uncomment when SITE_ADDRESS is a domain
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: ["/tmp:size=8m,noexec,nosuid"]
    mem_limit: 128m
    networks: [front, back]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 4s
      retries: 3
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }

networks:
  front: {} # edge <-> frontend
  back: {} # edge <-> backend

volumes:
  pact-data:
  caddy-data:
  caddy-config:
